# =============================================================================
#  SITE SETTINGS
#  Edit the values in this file first. After editing _config.yml you must
#  restart `bundle exec jekyll serve` for changes to show up locally
#  (GitHub Pages picks them up automatically on the next push).
# =============================================================================

# --- Who you are --------------------------------------------------------------
author:
  name: "Your Name"                       # REPLACE: shown in the header, hero, footer and page titles
  # One line under your name. Keep it factual: field + school/company.
  headline: "Electrical Engineering · Your University"   # REPLACE
  # One or two sentences: what you work on and what you want to do next.
  intro: >-
    Placeholder: one or two sentences about the engineering you do, such as
    the circuits, systems and tools you build and what you want to work on next.
  # Optional status line (internship search, graduation date, …). Leave "" to hide.
  status: "Placeholder: Graduating May 20XX · Open to summer internships"
  # Portrait shown in the About section. Put your photo in assets/img/ and
  # update the path. Leave "" to hide the photo entirely.
  photo: "/assets/img/placeholder-portrait.svg"

# --- Contact & profile links ---------------------------------------------------
# Each link is only displayed if `url` is filled in, so there are never dead
# links on the site. Order here = order on the page.
links:
  - label: "Email"
    url: ""                               # ADD: e.g. "mailto:you@example.com"
  - label: "GitHub"
    url: "https://github.com/CZuschmidt"
  - label: "LinkedIn"
    url: ""                               # ADD: e.g. "https://www.linkedin.com/in/your-handle/"
  - label: "Résumé (PDF)"
    url: ""                               # ADD: put the file at assets/files/resume.pdf, then use "/assets/files/resume.pdf"

# --- SEO / sharing ---------------------------------------------------------------
title: "Electrical Engineering Portfolio" # Used in the browser tab: "<name> — <title>"
description: >-
  Electrical engineering portfolio: hardware and software projects,
  coursework and activities.
og_image: "/assets/img/og-image.png"      # 1200×630 image shown when the site is shared
lang: "en"

# --- Hosting ------------------------------------------------------------------
# For a repository named `portfolio_website` the site lives at
#   https://czuschmidt.github.io/portfolio_website
# If you rename the repository to `CZuschmidt.github.io`, set baseurl to "".
url: "https://czuschmidt.github.io"
baseurl: "/portfolio_website"

# =============================================================================
#  You normally don't need to change anything below this line.
# =============================================================================
collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project

future: true                 # show projects even if their date is in the future
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter_opts:
    disable: true

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - tools

# =============================================================================
#  COURSES — shown in the "Courses" section, in the order listed here.
#
#  HOW TO ADD A COURSE
#    1. Copy the block between the two lines below.
#    2. Paste it where you want the course to appear (top = first).
#    3. Fill in the fields. Only `code` and `title` are required; delete any
#       optional line you don't need.
#
#  ---- copy from here --------------------------------------------------------
#  - code: "ESE 0000"                  # course number
#    title: "Course Title"
#    term: "Fall 2025"                 # optional
#    description: >-                   # optional, Markdown allowed
#      What the course covered and what you built or learned in it.
#    topics: ["Topic", "Topic"]        # optional, shown as small tags
#    project: "/projects/project-file-name/"   # optional, links to a project page
#  ---- to here ---------------------------------------------------------------
#
#  Indentation matters in YAML: keep two spaces before every field after the
#  first, exactly as in the examples.
# =============================================================================

- code: "ESE 2150"
  title: "Circuits and Systems"
  term: "Fall 2026"
  description: >-
    Analysis/design of linear circuits, Operational amplifiers, first and second order transient
    response, frequency response and transfer functions, diodes and MOSFETs in amplifier and logic 
    circuits. 
  topics: ["Circuit analysis", "Op-Amps", "MOSFETs", "Diodes"]
  # project: ""

- code: "ESE 2180"
  title: "Electronic, Photonic, and Electromechanical Devices"
  term: "Fall 2026"
  description: >-
    Design and physics of solid-state devices, semiconductor
    electronics and optoelectronics (LEDs, photodetectors, solar cells,
    transistors, memory), electromagnetic and optical devices (transmission
    lines, waveguides, fibers, antennas), and electromechanical sensors/actuators.
  topics: ["Semiconductors", "Optoelectronics", "LEDs"]

- code: "CIS 2400"
  title: "Introduction to Computer Systems"
  term: "Fall 2026"
  description: >-
    Computer architecture and design course, introduction into CMOS and logic 
    gate-level design, RISC-V assembly programming, C programming, memory management, 
    compiler design 
  topics: ["CMOS", "Logic Gates", "RISC-V assembly", "C", "Memory", "Compilers"]



<!doctype html>
<!--
  Source for assets/img/og-image.png (the preview image shown when your site
  is shared on LinkedIn, Slack, iMessage, …). Edit the text below, then run
  `node tools/render-images.mjs` to regenerate the PNG files, or open this file in a browser
  at 1200×630 and take a screenshot.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG image source</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@600&display=block">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; box-sizing: border-box;
    padding: 96px; background: #fafaf7; color: #111111;
    display: flex; flex-direction: column; justify-content: space-between;
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    border-bottom: 16px solid #ea580c;
  }
  .label { display: flex; align-items: center; gap: 16px;
    font: 500 24px/32px "IBM Plex Mono", monospace; letter-spacing: .06em; text-transform: uppercase; }
  .label::before { content: ""; width: 16px; height: 16px; background: #ea580c; }
  h1 { margin: 0; font-size: 80px; line-height: 88px; font-weight: 600; letter-spacing: -0.02em; max-width: 900px; }
  p { margin: 0; font: 400 28px/40px "IBM Plex Mono", monospace; color: #5a5a57; }
</style>
</head>
<body>
  <div class="label">Portfolio</div>
  <h1>Electrical Engineering Projects</h1>
  <p>Hardware · Firmware · Coursework · Activities</p>
</body>
</html>

<!doctype html>
<!--
  Source for assets/img/og-image.png (the preview image shown when your site
  is shared on LinkedIn, Slack, iMessage, …). Edit the text below, then run
  `node tools/render-images.mjs` to regenerate the PNG files, or open this file in a browser
  at 1200×630 and take a screenshot.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG image source</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,600&display=block">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; box-sizing: border-box;
    padding: 96px; background: #ffffff; color: #111111;
    display: flex; flex-direction: column; justify-content: space-between;
    font-family: "Source Sans 3", Helvetica, Arial, sans-serif;
    border-bottom: 16px solid #ea580c;
  }
  .label { font: 600 24px/32px "Source Sans 3", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #555555; }
  h1 { margin: 0; font-family: "Source Serif 4", Georgia, serif; font-size: 80px; line-height: 88px; font-weight: 600; letter-spacing: -0.02em; max-width: 900px; }
  p { margin: 0; font: 400 30px/40px "Source Sans 3", sans-serif; color: #555555; }
</style>
</head>
<body>
  <div class="label">Portfolio</div>
  <h1>Electrical Engineering Projects</h1>
  <p>Hardware · Firmware · Coursework · Activities</p>
</body>
</html>
